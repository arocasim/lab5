version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    depends_on:
      - redis

  auction-service:
    build: ./auction-service
    ports:
      - "8082:8082"
    depends_on:
      - user-service

  payment-service:
    build: ./payment-service
    ports:
      - "8083:8083"
    depends_on:
      - user-service
      - auction-service