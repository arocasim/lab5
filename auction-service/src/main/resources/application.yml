server:
  port: 8082

spring:
  application:
    name: auction-service

  datasource:
    url: jdbc:h2:file:./data/auctiondb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

services:
  user:
    url: http://user-service:8081