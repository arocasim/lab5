server:
  port: 8084

spring:
  application:
    name: bid-service

  datasource:
    url: jdbc:postgresql://postgres-bid:5432/biddb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

services:
  user:
    url: http://user-service:8081
  auction:
    url: http://auction-service:8082
