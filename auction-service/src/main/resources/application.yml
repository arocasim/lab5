server:
  port: 8082

spring:
  application:
    name: auction-service

  datasource:
    url: jdbc:postgresql://postgres-auction:5432/auctiondb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

services:
  user:
    url: http://user-service:8081
